<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Diagram: BI data flows through a BI-to-Ads sync into ad data, which feeds the ad search platform and the ad review services">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(345 22% 9%)"/>
      <stop offset="1" stop-color="hsl(260 18% 11%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0" stop-color="hsl(345 75% 60% / 0.28)"/>
      <stop offset="1" stop-color="hsl(345 75% 60% / 0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.6">
      <stop offset="0" stop-color="hsl(260 70% 60% / 0.14)"/>
      <stop offset="1" stop-color="hsl(260 70% 60% / 0)"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="hsl(0 0% 100% / 0.07)"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="hsl(345 75% 65% / 0.35)"/>
      <stop offset="1" stop-color="hsl(345 75% 65% / 0.9)"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="hsl(345 75% 68%)"/>
    </marker>
    <style>
      .label { font: 600 30px 'Space Grotesk', Inter, ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: hsl(330 15% 93%); }
      .kicker { font: 500 17px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2.5px; fill: hsl(330 8% 62%); }
      .tag { font: 600 14px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: hsl(345 80% 75%); }
      .node { fill: hsl(340 14% 14% / 0.92); stroke: hsl(0 0% 100% / 0.14); stroke-width: 2; }
      .node.built { stroke: hsl(345 75% 65% / 0.85); }
      .pill { fill: hsl(345 75% 60% / 0.16); stroke: hsl(345 75% 65% / 0.5); stroke-width: 1.5; }
      .wire { fill: none; stroke: url(#edge); stroke-width: 3; stroke-linecap: round; }
      .wire-plain { fill: none; stroke: hsl(345 75% 65% / 0.75); stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- edges -->
  <path class="wire" d="M372 500 H440" marker-end="url(#arrow)"/>
  <path class="wire" d="M738 500 H806" marker-end="url(#arrow)"/>
  <path class="wire-plain" d="M1104 500 C1150 500 1150 410 1196 410" marker-end="url(#arrow)"/>
  <path class="wire-plain" d="M1104 500 C1150 500 1150 590 1196 590" marker-end="url(#arrow)"/>

  <!-- BI data -->
  <g transform="translate(82 436)">
    <rect class="node" width="290" height="128" rx="20"/>
    <text class="kicker" x="28" y="48">SOURCE</text>
    <text class="label" x="28" y="92">BI data</text>
  </g>

  <!-- BI-to-Ads sync -->
  <g transform="translate(448 436)">
    <rect class="node built" width="290" height="128" rx="20"/>
    <text class="kicker" x="28" y="48">PIPELINE</text>
    <text class="label" x="28" y="92">BI-to-Ads sync</text>
    <rect class="pill" x="196" y="26" width="70" height="28" rx="14"/>
    <text class="tag" x="208" y="45">BUILT</text>
  </g>

  <!-- Ad data -->
  <g transform="translate(814 436)">
    <rect class="node" width="290" height="128" rx="20"/>
    <text class="kicker" x="28" y="48">STORE</text>
    <text class="label" x="28" y="92">Ad data</text>
  </g>

  <!-- Ad search platform -->
  <g transform="translate(1204 346)">
    <rect class="node built" width="330" height="128" rx="20"/>
    <text class="kicker" x="28" y="48">PLATFORM</text>
    <text class="label" x="28" y="92">Ad search</text>
    <rect class="pill" x="236" y="26" width="70" height="28" rx="14"/>
    <text class="tag" x="248" y="45">BUILT</text>
  </g>

  <!-- Ad review services -->
  <g transform="translate(1204 526)">
    <rect class="node built" width="330" height="128" rx="20"/>
    <text class="kicker" x="28" y="48">SERVICES</text>
    <text class="label" x="28" y="92">Ad review</text>
    <rect class="pill" x="222" y="26" width="84" height="28" rx="14"/>
    <text class="tag" x="234" y="45">SCALED</text>
  </g>
</svg>
